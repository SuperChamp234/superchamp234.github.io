name: Deploy 11ty Blog

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Pull LFS objects
        run: |
          git lfs install
          git lfs pull
          git lfs ls-files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache generated images
        uses: actions/cache@v4
        with:
          path: media/_generated
          key: images-${{ hashFiles('scripts/build-images.js', 'media/**/*.jpg', 'media/**/*.jpeg', 'media/**/*.JPG', 'media/**/*.png', 'media/**/*.mp4', 'media/**/*.mov', 'media/**/*.webp') }}
          restore-keys: |
            images-

      - name: Cache LaTeX
        uses: actions/cache@v4
        id: latex-cache
        with:
          path: /usr/share/texlive
          key: ${{ runner.os }}-texlive-${{ hashFiles('resume/**') }}
          restore-keys: |
            ${{ runner.os }}-texlive-

      - name: Install LaTeX dependencies
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-extra

      - name: Compile resume
        run: |
          chmod +x resume/compile.sh
          cd resume
          ./compile.sh
          cd ..

      - name: Build 11ty site
        run: npm run build

      - name: Verify generated media
        run: |
          test -f _site/media/_generated/manifest.json
          test -f _site/media/blog/cpu/pipelined_cpu.png
          find _site/media/_generated -name '*.avif' | head -5
          echo "Generated media copied successfully."

      - name: Ensure CNAME file exists
        run: echo 'zainsv.me' > _site/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          cname: zainsv.me
