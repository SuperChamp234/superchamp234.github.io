name: Deploy 11ty Blog

on:
  push:
    branches:
      - master  # Change this if you use a different default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Pull LFS objects
        run: |
          git lfs install
          git lfs pull
          # Verify LFS files are downloaded
          git lfs ls-files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install
      
      - name: Run compile.sh script in resume directory after installing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-full texlive-latex-extra
          chmod +x resume/compile.sh
          cd resume
          ./compile.sh
          cd ..

      - name: Build 11ty site
        run: npm run build

      - name: Verify media files were copied
        run: |
          echo "Checking for IMG_8601.JPG..."
          ls -la _site/media/2022-08/ || echo "Directory not found"
          file _site/media/2022-08/IMG_8601.JPG || echo "File not found or not a valid image"

      - name: Ensure CNAME file exists
        run: echo 'zainsv.me' > _site/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          cname: zainsv.me
